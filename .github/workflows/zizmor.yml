name: Zizmor

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Everything except pre-commit configs. This repo runs prek, whose
      # `repo: builtin` shorthand is not in upstream pre-commit's schema, so
      # zizmor cannot deserialize .pre-commit-config.yaml and aborts the whole
      # audit before it reaches a single workflow.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          collect: workflows,actions,dependabot
          # Code scanning needs GitHub Advanced Security, which a private repo
          # under a personal account cannot have, so the SARIF upload fails with
          # "Code scanning is not enabled for this repository". Inline
          # annotations report findings on the diff instead; zizmor still exits
          # non-zero, so the job keeps gating. Revisit if this repo goes public.
          advanced-security: false
          annotations: true
