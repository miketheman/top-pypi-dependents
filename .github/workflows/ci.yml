name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: false
      - name: Set up Python
        run: uv python install 3.14
      - name: Sync
        run: uv sync
      - name: Format check
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run ty check src tests
      # Runs without the bigquery group on purpose: this is what proves the
      # google-cloud-bigquery and urllib3 imports are genuinely lazy, so every
      # subcommand except `extract` works on a default sync.
      - name: Test without the bigquery group
        run: |
          uv run python -c "import top_pypi_dependents.cli, top_pypi_dependents.sources.bigquery"
          uv run coverage run -m pytest
          uv run coverage report

      # The two fetch_live_names tests skip above because urllib3 lives in the
      # bigquery group. They cover the retry and non-2xx paths, so run the suite
      # again with the group installed rather than leaving that code untested.
      - name: Test with the bigquery group
        run: |
          uv sync --group bigquery
          uv run ty check src tests
          uv run pytest -q
