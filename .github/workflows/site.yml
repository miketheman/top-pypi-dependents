name: Site

# Republishes the site from the ranked JSON already committed to the repository.
# Rendering needs no BigQuery query, no DuckDB database, and not even the
# `bigquery` dependency group -- so a template change costs a checkout and a
# render rather than a billable extract. `refresh.yml` still owns the monthly
# data run and deploys its own result.
#
# `data/latest.json` is watched for a hand-regenerated payload. The monthly run
# cannot double-deploy through it: that commit is pushed with GITHUB_TOKEN, and
# GitHub does not start workflows from those.
on:
  push:
    branches: [main]
    paths:
      - "src/top_pypi_dependents/templates/**"
      - "src/top_pypi_dependents/render.py"
      - "data/latest.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Shared with the deploy job in `refresh.yml`: two workflows can deploy Pages,
# and they must not do it at once. Never cancels in progress -- the run being
# cancelled could be the monthly one, which is expensive to redo.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Render the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      # Deliberately without `--group bigquery`: rendering reads a JSON file.
      - name: Sync
        run: uv sync

      - name: Render
        run: uv run top-pypi-dependents render --payload data/latest.json --output site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
