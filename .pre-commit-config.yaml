# See https://pre-commit.com for more information. Run with prek.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # data/latest.json is the artifact this repo exists to commit: 100,000
      # rows measure ~18.5 MB, well past the 500 KB default. 25 MB still stops
      # a stray DuckDB database from being committed.
      - id: check-added-large-files
        args: [--maxkb=25000]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.91
    hooks:
      - id: ty
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.2
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.6.2"]
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
